
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a35">
  <title>EXAM MASTER JUNIOR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101a35;
      color: white;
    }
    header {
      padding: 28px 18px;
      background: #182957;
      text-align: center;
    }
    header h1 { margin: 0; color: #70c8ff; }
    main { padding: 20px; max-width: 700px; margin: auto; }
    .card {
      background: #1b2b50;
      padding: 20px;
      margin: 15px 0;
      border-radius: 14px;
    }
    button {
      border: 0;
      border-radius: 9px;
      padding: 13px 18px;
      background: #1689e8;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    select {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
    }
    footer { text-align: center; padding: 25px; color: #b9c8df; }
  </style>
</head>
<body>
  <header>
    <h1>EXAM MASTER JUNIOR</h1>
    <p>Learn • Practise • Prepare • Succeed</p>
  </header>

  <main>
    <section class="card">
      <h2>Welcome, Student!</h2>
      <p>Your junior secondary learning centre.</p>
    </section>

    <section class="card">
      <h2>Learning Centre</h2>
      <label for="classSelect">Choose your class</label>
      <select id="classSelect">
        <option>JSS 1</option>
        <option>JSS 2</option>
        <option>JSS 3</option>
      </select>

      <label for="termSelect">Choose your term</label>
      <select id="termSelect">
        <option>First Term</option>
        <option>Second Term</option>
        <option>Third Term</option>
      </select>

      <button onclick="openLearning()">Continue</button>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>What you can do</h2>
      <p>📚 Study lesson notes</p>
      <p>✍️ Practise questions</p>
      <p>⏱️ Take timed CBT examinations</p>
      <p>📊 Track your performance</p>
    </section>
  </main>

  <footer>EXAM MASTER JUNIOR © 2026</footer>

  <script>
    function openLearning() {
      const studentClass =
        document.getElementById("classSelect").value;
      const term =
        document.getElementById("termSelect").value;

      document.getElementById("message").textContent =
        studentClass + " — " + term +
        " selected. Learning materials are coming next.";
    }
  </script>
</body>
</html>
