<section id="profilePage" class="page">
  <button class="back" onclick="goBack()">← Back</button>

  <h1>Student Profile</h1>
  <p class="muted">Manage your learning identity.</p>

  <div class="panel">
    <div style="text-align:center;padding:15px">
      <div style="font-size:55px">🎓</div>
      <h2 id="profileDisplayName">Student</h2>
      <p class="muted" id="profileDisplayClass">JSS 1</p>
    </div>

    <label for="studentName">Student Name</label>
    <input id="studentName" type="text"
      maxlength="50" placeholder="Enter your name">

    <label for="studentClass">Select Class</label>
    <select id="studentClass">
      <option value="JSS 1">JSS 1</option>
      <option value="JSS 2">JSS 2</option>
      <option value="JSS 3">JSS 3</option>
    </select>

    <button class="action" onclick="saveStudentProfile()">
      Save Profile
    </button>
    <p id="profileMessage" class="muted"></p>
  </div>

  <div class="panel">
    <h3>Appearance</h3>
    <label for="themeSelect">Choose App Theme</label>
    <select id="themeSelect" onchange="saveThemePreference()">
      <option value="dark">Dark Theme</option>
      <option value="light">Light Theme</option>
    </select>
    <p class="muted">Your theme preference is saved on this device.</p>
  </div>

  <div class="panel">
    <h3>My Account</h3>
    <p>EXAM MASTER JUNIOR</p>
    <p class="muted">Your profile is saved locally on this device.</p>
  </div>
</section>

<script>
function loadStudentProfile() {
  const profile = JSON.parse(
    localStorage.getItem("examMasterStudentProfile") || "{}"
  );

  document.getElementById("studentName").value = profile.name || "";
  document.getElementById("studentClass").value = profile.studentClass || "JSS 1";

  updateProfileDisplay();
}

function saveStudentProfile() {
  const name = document.getElementById("studentName").value.trim();
  const studentClass = document.getElementById("studentClass").value;

  if (!name) {
    document.getElementById("profileMessage").textContent =
      "Please enter your name.";
    return;
  }

  localStorage.setItem("examMasterStudentProfile", JSON.stringify({
    name,
    studentClass
  }));

  updateProfileDisplay();
  document.getElementById("profileMessage").textContent =
    "Profile saved successfully.";
}

function updateProfileDisplay() {
  const profile = JSON.parse(
    localStorage.getItem("examMasterStudentProfile") || "{}"
  );

  document.getElementById("profileDisplayName").textContent =
    profile.name || "Student";

  document.getElementById("profileDisplayClass").textContent =
    profile.studentClass || "JSS 1";
}

function applyTheme(theme) {
  document.body.classList.toggle("light-theme", theme === "light");
  document.getElementById("themeSelect").value = theme;
}

function saveThemePreference() {
  const theme = document.getElementById("themeSelect").value;
  localStorage.setItem("examMasterTheme", theme);
  applyTheme(theme);
}

function loadThemePreference() {
  const theme = localStorage.getItem("examMasterTheme") || "dark";
  applyTheme(theme);
}

loadStudentProfile();
loadThemePreference();
</script>
